# Local: `docker compose up -d --build`   Server: `docker compose pull app && docker compose up -d`
services:
  app:
    image: ${APP_IMAGE:-ghcr.io/vibrantaqua/snake-game}:${APP_TAG:-latest}
    build: .
    environment:
      APP_SECRET_KEY: ${APP_SECRET_KEY:-local-dev-secret}
    ports: ["5000:5000"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
    ports: ["9090:9090"]
    depends_on: [app]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
